version: 2
updates:
  # Rust workspace - direct dependencies only.
  # Most transitive Rust alerts (wasmtime, rustls-webpki, yamux, hickory-proto)
  # are pinned by polkadot-sdk and are tracked in
  # docs/operations/SECURITY_HYGIENE_QUEUE_2026-05-02.md as SDK-blocked
  # until the next polkadot-sdk upgrade.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # SDK-pinned: bump only via polkadot-sdk upgrade branch.
      - dependency-name: "polkadot-sdk"
      - dependency-name: "frame-*"
      - dependency-name: "sp-*"
      - dependency-name: "sc-*"
      - dependency-name: "pallet-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # This action's ref IS the Rust toolchain version, not an action version. Dependabot
    # reads `@1.90.0` as a semver and proposes e.g. `1.120.0`, which would silently swap
    # the compiler for every build. Confirmed live in gem#6: all 10 contract tests failed
    # in 4-7s. Bumping Rust is a deliberate change with its own CI run, not an automated one.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
