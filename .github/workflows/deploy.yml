# ─────────────────────────────────────────────────────────
# BelizeChain Node — CI/CD Pipeline
# Trigger: push to main  ·  manual dispatch
# Flow:    test → build → push ACR → deploy Azure VM
# ─────────────────────────────────────────────────────────

name: Build & Deploy Blockchain Node

on:
  push:
    branches: [belizechain]
  pull_request:
    branches: [belizechain]
  workflow_dispatch:

env:
  REGISTRY: belizechainacr.azurecr.io
  IMAGE_NAME: belizechain-node
  NODE_NAME: "BelizeChain-Testnet-Validator-1"

# Only one deploy at a time; cancel superseded runs
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Run Rust unit tests ────────────────────────────
  test:
    name: 🧪 Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-

      - name: Run tests
        run: cargo test --release --workspace

  # ── 1c. Coverage gate (must reach 100%) ──────────────────────────────
  coverage:
    name: 📊 Coverage Gate (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-cov-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage (enforce 100%)
        # .tarpaulin.toml is picked up automatically.
        # Excludes service.rs and rpc.rs (infrastructure layer).
        # Fails the job if coverage drops below 100%.
        run: cargo tarpaulin

      - name: Upload coverage report (Lcov → Codecov)
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/lcov.info
          fail_ci_if_error: false   # coverage upload is best-effort; gate is tarpaulin

  # ── 1b. Run pallet benchmarks (smoke test) ───────────
  benchmark:
    name: ⚖️ Benchmark Smoke Test
    runs-on: ubuntu-latest
    # Benchmarks are expensive — only run on push to main, not on PRs
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-bench-

      - name: Build with runtime-benchmarks feature
        run: cargo build --release --features runtime-benchmarks

      - name: Run benchmark smoke test (frame-system baseline)
        run: |
          ./target/release/belizechain-node benchmark pallet \
            --chain dev \
            --pallet frame_system \
            --extrinsic '*' \
            --steps 2 \
            --repeat 1 \
            --output /dev/null \
            2>&1 | head -50
        # Smoke test only — 2 steps, 1 repeat is enough to verify benchmarks compile and run.
        # Full benchmarking (--steps 50 --repeat 20) should be run before releases.

  # ── 2. Build Docker image & push to ACR ───────────────
  build:
    name: 🐳 Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # Only build on pushes to main (not on PRs)
    if: github.event_name != 'pull_request'
    # ACR credentials (ACR_USERNAME / ACR_PASSWORD) must be valid in GitHub Secrets.
    # If login fails with 403, rotate the service principal in Azure Portal and
    # update the secrets at: Settings → Secrets and variables → Actions → Secrets.
    continue-on-error: true
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── 3. Deploy to AKS ──────────────────────────────────
  deploy:
    name: 🚀 Deploy to Testnet (AKS)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testnet               # add environment protection rules in GitHub Settings

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Create namespace (if needed)
        run: kubectl create namespace belizechain --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        run: |
          cat <<EOFK | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: belizechain-node
            namespace: belizechain
            labels:
              app: belizechain-node
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: belizechain-node
            template:
              metadata:
                labels:
                  app: belizechain-node
              spec:
                containers:
                  - name: belizechain-node
                    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                    ports:
                      - containerPort: 30333
                        name: p2p
                      - containerPort: 9944
                        name: rpc
                      - containerPort: 9615
                        name: metrics
                    args:
                      - "--chain"
                      - "/etc/belizechain/testnet-chain-spec-raw.json"
                      - "--base-path"
                      - "/data"
                      - "--name"
                      - "${{ env.NODE_NAME }}"
                      - "--validator"
                      - "--alice"
                      - "--force-authoring"
                      - "--rpc-port"
                      - "9944"
                      - "--rpc-cors"
                      - "all"
                      - "--unsafe-rpc-external"
                      - "--rpc-methods"
                      - "Safe"
                      - "--prometheus-port"
                      - "9615"
                      - "--prometheus-external"
                      - "--trie-cache-size"
                      - "268435456"
                      - "--state-pruning"
                      - "archive"
                    volumeMounts:
                      - name: blockchain-data
                        mountPath: /data
                    resources:
                      requests:
                        cpu: "500m"
                        memory: "1Gi"
                      limits:
                        cpu: "1500m"
                        memory: "3Gi"
                volumes:
                  - name: blockchain-data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: belizechain-node
            namespace: belizechain
          spec:
            selector:
              app: belizechain-node
            ports:
              - name: p2p
                port: 30333
                targetPort: 30333
              - name: rpc
                port: 9944
                targetPort: 9944
              - name: metrics
                port: 9615
                targetPort: 9615
            type: LoadBalancer
          EOFK

      - name: Wait for rollout
        run: kubectl rollout status deployment/belizechain-node -n belizechain --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n belizechain -o wide
          kubectl get svc -n belizechain
