# BelizeChain Node CI
# Self-hosted Ceiba deployment is handled outside this workflow.

name: Build and Validate

on:
  push:
    branches: [belizechain]
  pull_request:
    branches: [belizechain]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — no job here writes to the repo or GitHub Security.
permissions:
  contents: read

env:
  TMPDIR: /tmp

jobs:
  lint:
    name: Formatting and Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # See the note on the identical step in `test`. clippy compiles every
      # crate in the workspace, so it fills the same ~14 GB just like a test run.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/graalvm
          sudo apt-get clean
          echo "disk after:"; df -h / | tail -1

      - name: Install Rust toolchain
        # The @1.90.0 ref itself pins the toolchain. This action has NO
        # `toolchain` input — passing one is silently ignored.
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Pinned, not floating: `libclang-dev` alone installs whatever clang the image
          # prefers, and bindgen then requests the exact soname it detected (for
          # example `-lclang-18.1.3`). When the versioned library is absent the link
          # fails with `unable to find library -lclang-18.1.3`, which is an image
          # change rather than a code defect. Both packages are pinned so the runner
          # and the toolchain move only when this line changes.
          sudo apt-get install -y protobuf-compiler libclang-18-dev llvm-18-dev

      - name: Configure portable LLVM paths
        # `llvm-18-dev` installs `llvm-config-18` and does NOT provide the
        # unversioned `llvm-config` symlink that `llvm-dev` does, so resolving
        # only the bare name fails the step on a pinned runner. Try both, and
        # fail with the reason rather than a bare exit 1 from `command -v`.
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config || command -v llvm-config-18 || true)"
          if [[ -z "${LLVM_CONFIG_BIN}" ]]; then
            echo "::error::no llvm-config on PATH; is llvm-18-dev installed?" >&2
            exit 1
          fi
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-lint-

      - name: Run rustfmt check
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The GitHub runner image arrives with ~14 GB free because ~30 GB of
      # preinstalled toolchains sit in paths the Rust build never touches.
      # Measured on 2026-11-02: this job died with "No space left on device"
      # while building the release node, which reads exactly like a test failure
      # but is not.
      # Reclaims ~25 GB in seconds. Deliberately plain `rm` rather than a
      # third-party reclaim action, so nothing new executes on the runner.
      # Removes only toolchain dirs; /opt/hostedtoolcache stays whole because
      # setup-python and setup-node live there.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/graalvm
          sudo apt-get clean
          echo "disk after:"; df -h / | tail -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Pinned, not floating: `libclang-dev` alone installs whatever clang the image
          # prefers, and bindgen then requests the exact soname it detected (for
          # example `-lclang-18.1.3`). When the versioned library is absent the link
          # fails with `unable to find library -lclang-18.1.3`, which is an image
          # change rather than a code defect. Both packages are pinned so the runner
          # and the toolchain move only when this line changes.
          sudo apt-get install -y protobuf-compiler libclang-18-dev llvm-18-dev

      - name: Configure portable LLVM paths
        # `llvm-18-dev` installs `llvm-config-18` and does NOT provide the
        # unversioned `llvm-config` symlink that `llvm-dev` does, so resolving
        # only the bare name fails the step on a pinned runner. Try both, and
        # fail with the reason rather than a bare exit 1 from `command -v`.
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config || command -v llvm-config-18 || true)"
          if [[ -z "${LLVM_CONFIG_BIN}" ]]; then
            echo "::error::no llvm-config on PATH; is llvm-18-dev installed?" >&2
            exit 1
          fi
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-

      - name: Run tests
        run: cargo test --release --workspace

      # M-7: keep the try-runtime feature wiring compiling. Without this, the
      # runtime's try-runtime hooks and pallet features can silently bit-rot.
      - name: Check runtime try-runtime features
        run: cargo check -p belizechain-runtime --features try-runtime

      - name: Validate chain-spec preflight guards
        run: |
          # Placeholder mainnet template: must pass every guard.
          bash ./scripts/deploy/validate_chain_spec.sh ./chain-specs/chain-spec-production.json

          # Self-test: a dev-keyed spec must be rejected by the dev-account guard.
          printf '%s' '{"name":"guard self test","id":"guard_self_test","chainType":"Live","genesis":{"runtimeGenesis":{"patch":{"sudo":{"key":"5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"}}}}}' \
            > /tmp/belizechain-dev-keyed-spec.json
          if bash ./scripts/deploy/validate_chain_spec.sh /tmp/belizechain-dev-keyed-spec.json >/dev/null 2>&1; then
            echo "ERROR: dev-account guard accepted a dev-keyed chain spec" >&2
            exit 1
          fi
          echo "OK: dev-account guard rejects dev-keyed chain specs"

      - name: Build release node for explicit-spec smoke test
        run: cargo build --release -p belizechain-node

      - name: Smoke test explicit raw spec boot
        run: |
          # The built-in template is intentionally dev-keyed, so generating and
          # validating it requires the explicit dev-seed allowance here.
          BELIZECHAIN_ALLOW_DEV_SEEDS=1 ./target/release/belizechain-node build-spec \
            --disable-default-bootnode \
            --chain testnet-template > /tmp/belizechain-testnet-template.json
          BELIZECHAIN_ALLOW_DEV_SEEDS=1 ./target/release/belizechain-node build-spec \
            --disable-default-bootnode \
            --chain /tmp/belizechain-testnet-template.json \
            --raw > /tmp/belizechain-testnet-template-raw.json
          bash ./scripts/deploy/validate_chain_spec.sh /tmp/belizechain-testnet-template-raw.json --allow-dev-accounts

          ./target/release/belizechain-node \
            --chain /tmp/belizechain-testnet-template-raw.json \
            --tmp \
            --port 30334 \
            --rpc-port 9935 \
            --prometheus-port 9616 \
            --rpc-methods Safe \
            > /tmp/belizechain-testnet-smoke.log 2>&1 &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true; wait "$NODE_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 15); do
            CHAIN=$(curl -sS -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"system_chain","params":[]}' \
              http://127.0.0.1:9935 || true)
            TYPE=$(curl -sS -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"system_chainType","params":[]}' \
              http://127.0.0.1:9935 || true)

            if echo "$CHAIN" | grep -q 'BelizeChain' && echo "$TYPE" | grep -q 'Live'; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/belizechain-testnet-smoke.log
          exit 1

  # M-4: the Python integration/security suites under tests/ were never *run* by
  # CI — only collected, which is why 17 stale tests stayed red for months while
  # the pipeline reported green. They now genuinely execute against a local
  # `--dev` node booted from the release binary built in the `test` job.
  #
  # Suites needing the wider Ceiba stack (Postgres, Redis, IPFS, Nawal, Kinich)
  # skip themselves at fixture level and are reported as SKIPPED, not passed.
  python-tests:
    name: Python Integration Suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # See the note on the identical step in `test` — this job also builds the
      # node and additionally needs room for the Python environment.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/graalvm
          sudo apt-get clean
          echo "disk after:"; df -h / | tail -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Pinned, not floating: `libclang-dev` alone installs whatever clang the image
          # prefers, and bindgen then requests the exact soname it detected (for
          # example `-lclang-18.1.3`). When the versioned library is absent the link
          # fails with `unable to find library -lclang-18.1.3`, which is an image
          # change rather than a code defect. Both packages are pinned so the runner
          # and the toolchain move only when this line changes.
          sudo apt-get install -y protobuf-compiler libclang-18-dev llvm-18-dev

      - name: Configure portable LLVM paths
        # `llvm-18-dev` installs `llvm-config-18` and does NOT provide the
        # unversioned `llvm-config` symlink that `llvm-dev` does, so resolving
        # only the bare name fails the step on a pinned runner. Try both, and
        # fail with the reason rather than a bare exit 1 from `command -v`.
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config || command -v llvm-config-18 || true)"
          if [[ -z "${LLVM_CONFIG_BIN}" ]]; then
            echo "::error::no llvm-config on PATH; is llvm-18-dev installed?" >&2
            exit 1
          fi
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pytests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-pytests-

      - name: Build node for the integration suites
        run: cargo build --release -p belizechain-node

      - name: Boot a local dev chain
        run: |
          ./target/release/belizechain-node \
            --dev \
            --base-path /tmp/belizechain-pytest \
            --rpc-port 9944 \
            --rpc-methods Unsafe \
            --prometheus-port 9616 \
            > /tmp/belizechain-pytest-node.log 2>&1 &
          echo $! > /tmp/belizechain-pytest-node.pid

          for _ in $(seq 1 60); do
            if curl -sS -m 2 -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"system_health","params":[]}' \
              http://127.0.0.1:9944 | grep -q '"result"'; then
              echo "dev chain is up"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/belizechain-pytest-node.log
          exit 1

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      # One invocation, so file order is stable and `tests/governance/test_council.py`
      # runs before the suites that need a council seat to exist.
      # `-rs` prints every skip reason, so a suite that silently stops asserting
      # is visible in the log rather than looking like a pass.
      #
      # The `pristine_oracle_rate` tests run first and alone: they need a chain on
      # which no Oracle rate has been written, and `update_exchange_rate` has no
      # inverse. Everything after them may (and does) set the rate.
      - name: Fail-closed guard (needs a chain with no Oracle rate yet)
        run: |
          python -m pytest \
            -m pristine_oracle_rate \
            tests/belizex \
            -q -rs --timeout=180 -p no:cacheprovider

      - name: Run every chain-only suite
        run: |
          python -m pytest \
            tests/economic \
            tests/belizex \
            tests/governance \
            tests/oracle \
            tests/cross_pallet \
            tests/blockchain \
            tests/test_probe.py \
            tests/test_chain_spec_guard.py \
            -m "not pristine_oracle_rate" \
            -q -rs --timeout=180 -p no:cacheprovider

      # Two suites need infrastructure the dev chain does not provide:
      #   tests/e2e             -> Pakit/IPFS, Nawal FL server, Kinich API
      #   tests/test_full_stack -> Redis, IPFS, Postgres
      # Both self-skip via their fixtures. Running them here proves they still
      # import and keeps the exclusion visible instead of silent.
      - name: Service-dependent suites (self-skipping, must still import)
        run: |
          python -m pytest tests/e2e tests/test_full_stack.py \
            -q -rs --timeout=60 -p no:cacheprovider

      - name: Collect every suite (catches import rot anywhere in tests/)
        run: python -m pytest tests/ --collect-only -q

      - name: Stop the dev chain
        if: always()
        run: |
          if [ -f /tmp/belizechain-pytest-node.pid ]; then
            kill "$(cat /tmp/belizechain-pytest-node.pid)" 2>/dev/null || true
          fi
          echo "--- node log tail ---"
          tail -n 40 /tmp/belizechain-pytest-node.log 2>/dev/null || true

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # See the note on the identical step in `test`. tarpaulin re-instruments
      # every crate and needs more room than a plain test run.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/graalvm
          sudo apt-get clean
          echo "disk after:"; df -h / | tail -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Pinned, not floating: `libclang-dev` alone installs whatever clang the image
          # prefers, and bindgen then requests the exact soname it detected (for
          # example `-lclang-18.1.3`). When the versioned library is absent the link
          # fails with `unable to find library -lclang-18.1.3`, which is an image
          # change rather than a code defect. Both packages are pinned so the runner
          # and the toolchain move only when this line changes.
          sudo apt-get install -y protobuf-compiler libclang-18-dev llvm-18-dev

      - name: Configure portable LLVM paths
        # `llvm-18-dev` installs `llvm-config-18` and does NOT provide the
        # unversioned `llvm-config` symlink that `llvm-dev` does, so resolving
        # only the bare name fails the step on a pinned runner. Try both, and
        # fail with the reason rather than a bare exit 1 from `command -v`.
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config || command -v llvm-config-18 || true)"
          if [[ -z "${LLVM_CONFIG_BIN}" ]]; then
            echo "::error::no llvm-config on PATH; is llvm-18-dev installed?" >&2
            exit 1
          fi
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-cov-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked

      - name: Run coverage (enforce configured threshold)
        run: cargo tarpaulin

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          files: target/coverage/lcov.info
          fail_ci_if_error: false

  benchmark:
    name: Benchmark Smoke Test
    runs-on: ubuntu-24.04
    # Runs on pull requests too: every benchmark must execute against the real
    # runtime config before weights are regenerated from it. Mock-level
    # `bench_*` tests are not sufficient — they use permissive pallet mocks
    # (e.g. a minimum balance of 1) and pass where the dev-chain run fails.
    steps:
      - uses: actions/checkout@v7
        with:
          # `check_weights_freshness.sh` compares each weights.rs DATE against
          # the last commit touching its pallet's lib.rs/benchmarking.rs. Under
          # the default shallow clone `git log` reports the tip commit for every
          # path, which makes that comparison vacuous - it would pass on a stale
          # tree. Full history is required (and only ~37MB packed).
          fetch-depth: 0

      - name: Check weights are not stale
        # Runs before the build so a stale tree fails in seconds rather than
        # after a full benchmark build. Catches the failure mode that shipped a
        # stale `submit_storage_proof` in spec 115.
        run: |
          chmod +x ./scripts/check_weights_freshness.sh
          ./scripts/check_weights_freshness.sh

      # See the note on the identical step in `test`. The runtime-benchmarks
      # build is the largest artifact set of any job here, so it needs the room
      # most. Placed after the freshness check so a stale tree still fails fast.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/graalvm
          sudo apt-get clean
          echo "disk after:"; df -h / | tail -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Pinned, not floating: `libclang-dev` alone installs whatever clang the image
          # prefers, and bindgen then requests the exact soname it detected (for
          # example `-lclang-18.1.3`). When the versioned library is absent the link
          # fails with `unable to find library -lclang-18.1.3`, which is an image
          # change rather than a code defect. Both packages are pinned so the runner
          # and the toolchain move only when this line changes.
          sudo apt-get install -y protobuf-compiler libclang-18-dev llvm-18-dev

      - name: Configure portable LLVM paths
        # `llvm-18-dev` installs `llvm-config-18` and does NOT provide the
        # unversioned `llvm-config` symlink that `llvm-dev` does, so resolving
        # only the bare name fails the step on a pinned runner. Try both, and
        # fail with the reason rather than a bare exit 1 from `command -v`.
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config || command -v llvm-config-18 || true)"
          if [[ -z "${LLVM_CONFIG_BIN}" ]]; then
            echo "::error::no llvm-config on PATH; is llvm-18-dev installed?" >&2
            exit 1
          fi
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-bench-

      - name: Build with runtime-benchmarks feature
        run: cargo build --release --features runtime-benchmarks

      - name: Run benchmark smoke test (all Belize pallets)
        run: |
          chmod +x ./scripts/bench_smoke.sh
          ./scripts/bench_smoke.sh
