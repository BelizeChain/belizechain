# BelizeChain Node CI
# Self-hosted Ceiba deployment is handled outside this workflow.

name: Build and Validate

on:
  push:
    branches: [belizechain]
  pull_request:
    branches: [belizechain]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TMPDIR: /tmp

jobs:
  lint:
    name: Formatting and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev llvm-dev

      - name: Configure portable LLVM paths
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-lint-

      - name: Run rustfmt check
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev llvm-dev

      - name: Configure portable LLVM paths
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-

      - name: Run tests
        run: cargo test --release --workspace

      # M-7: keep the try-runtime feature wiring compiling. Without this, the
      # runtime's try-runtime hooks and pallet features can silently bit-rot.
      - name: Check runtime try-runtime features
        run: cargo check -p belizechain-runtime --features try-runtime

      - name: Validate chain-spec preflight guards
        run: |
          # Placeholder mainnet template: must pass every guard.
          bash ./scripts/deploy/validate_chain_spec.sh ./chain-specs/chain-spec-production.json

          # Self-test: a dev-keyed spec must be rejected by the dev-account guard.
          printf '%s' '{"name":"guard self test","id":"guard_self_test","chainType":"Live","genesis":{"runtimeGenesis":{"patch":{"sudo":{"key":"5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"}}}}}' \
            > /tmp/belizechain-dev-keyed-spec.json
          if bash ./scripts/deploy/validate_chain_spec.sh /tmp/belizechain-dev-keyed-spec.json >/dev/null 2>&1; then
            echo "ERROR: dev-account guard accepted a dev-keyed chain spec" >&2
            exit 1
          fi
          echo "OK: dev-account guard rejects dev-keyed chain specs"

      - name: Build release node for explicit-spec smoke test
        run: cargo build --release -p belizechain-node

      - name: Smoke test explicit raw spec boot
        run: |
          # The built-in template is intentionally dev-keyed, so generating and
          # validating it requires the explicit dev-seed allowance here.
          BELIZECHAIN_ALLOW_DEV_SEEDS=1 ./target/release/belizechain-node build-spec \
            --disable-default-bootnode \
            --chain testnet-template > /tmp/belizechain-testnet-template.json
          BELIZECHAIN_ALLOW_DEV_SEEDS=1 ./target/release/belizechain-node build-spec \
            --disable-default-bootnode \
            --chain /tmp/belizechain-testnet-template.json \
            --raw > /tmp/belizechain-testnet-template-raw.json
          bash ./scripts/deploy/validate_chain_spec.sh /tmp/belizechain-testnet-template-raw.json --allow-dev-accounts

          ./target/release/belizechain-node \
            --chain /tmp/belizechain-testnet-template-raw.json \
            --tmp \
            --port 30334 \
            --rpc-port 9935 \
            --prometheus-port 9616 \
            --rpc-methods Safe \
            > /tmp/belizechain-testnet-smoke.log 2>&1 &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true; wait "$NODE_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 15); do
            CHAIN=$(curl -sS -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"system_chain","params":[]}' \
              http://127.0.0.1:9935 || true)
            TYPE=$(curl -sS -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"system_chainType","params":[]}' \
              http://127.0.0.1:9935 || true)

            if echo "$CHAIN" | grep -q 'BelizeChain' && echo "$TYPE" | grep -q 'Live'; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/belizechain-testnet-smoke.log
          exit 1

  # M-4: the Python integration/security suites under tests/ were never checked
  # by CI. They need the full Ceiba service stack (chain, Postgres, Redis, IPFS,
  # Nawal, Kinich) to *run*, but collection alone catches import rot, syntax
  # errors and stale fixture wiring, which is what CI can honestly enforce here.
  # Full runs stay a documented, operator-triggered activity (tests/README.md).
  python-tests:
    name: Python Integration Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Collect integration suites
        run: python -m pytest tests/ --collect-only -q

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev llvm-dev

      - name: Configure portable LLVM paths
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-cov-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked

      - name: Run coverage (enforce configured threshold)
        run: cargo tarpaulin

      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        with:
          files: target/coverage/lcov.info
          fail_ci_if_error: false

  benchmark:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    # Runs on pull requests too: every benchmark must execute against the real
    # runtime config before weights are regenerated from it. Mock-level
    # `bench_*` tests are not sufficient — they use permissive pallet mocks
    # (e.g. a minimum balance of 1) and pass where the dev-chain run fails.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev llvm-dev

      - name: Configure portable LLVM paths
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config)"
          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_BIN}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(${LLVM_CONFIG_BIN} --libdir)" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-bench-

      - name: Build with runtime-benchmarks feature
        run: cargo build --release --features runtime-benchmarks

      - name: Run benchmark smoke test (all Belize pallets)
        run: |
          chmod +x ./scripts/bench_smoke.sh
          ./scripts/bench_smoke.sh
