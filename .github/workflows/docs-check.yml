# ──────────────────────────────────────────────────────────
# Docs Claims Check — do the repo's docs and configs agree with reality?
#
# This repo hosts the canonical checker (`scripts/doc-claims/`), so it runs the
# local copy. Every other BelizeChain repo fetches this same script from here
# rather than keeping a copy that could drift.
#
# It verifies that markdown links resolve, that compose ${VAR:?} requirements
# are supplied by the CI job that validates them, that Node versions align, and
# that image pins are documented. It covers the MECHANICAL class of doc drift;
# the semantic class ("is X actually live?") is handled by the docs-alignment
# prompt during a live agent sweep.
#
# In CI only this repo is checked out, so cross-repo checks skip. Run it from a
# full workspace checkout for those.
# ──────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────
# Docs Claims Check — do the repo's docs and configs agree with reality?
#
# This repo hosts the canonical checker (`scripts/doc-claims/`), so it runs the
# local copy. Every other BelizeChain repo fetches this same script from here
# rather than keeping a copy that could drift.
#
# It verifies that markdown links resolve, that cross-repo `compose_call`
# targets exist (including upstream pallets, resolved from cargo-registry
# source), that compose ${VAR:?} requirements are supplied by the CI job that
# validates them, that Node versions align, and that image pins are documented.
# It covers the MECHANICAL class of doc drift; the semantic class ("is X
# actually live?") is handled by the docs-alignment prompt during a live agent
# sweep.
#
# TWO JOBS, DELIBERATELY:
#   doc-claims      — this repo only. Always runs, no secrets needed.
#   workspace       — all sibling repos. Needs a cross-repo read token, because
#                     the sibling repos are private. This is the job that
#                     catches a call to an extrinsic another repo invented.
#
# Why the split matters: the cross-repo checks used to be unreachable in CI
# (only this repo was checked out), so `Contracts.store_contract_data` — an
# extrinsic that never existed — passed CI for months and was only caught by a
# hand sweep. A check that cannot run is not a check.
# ──────────────────────────────────────────────────────────
name: Docs Claims Check

on:
  push:
    branches: [belizechain]
  pull_request:
    branches: [belizechain]
  schedule:
    # Nightly, so a missing cross-repo token cannot rot silently for months.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-claims:
    name: 📄 Docs claims vs reality (this repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run doc-claims checker
        run: ./scripts/doc-claims/check-doc-claims.sh .

  workspace:
    name: 📄 Docs claims vs reality (all repos)
    runs-on: ubuntu-latest
    steps:
      - name: Check the cross-repo token is present AND still valid
        id: token
        env:
          TOKEN: ${{ secrets.BELIECHAIN_CI_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            message="BELIECHAIN_CI_TOKEN is not set, so the sibling repos could not"
            message="$message be checked out. The cross-repo half of this check — the"
            message="$message half that catches a call to an extrinsic that does not"
            message="$message exist — is NOT gating this commit."
            echo "::warning title=Cross-repo checks did not run::$message"
            exit 0
          fi

          # A secret is an opaque stored string: when the PAT expires, GitHub does
          # not blank it. `present` would stay true and every checkout below would
          # fail with a bare 404 — which reads as "the repo was deleted" instead of
          # "rotate the token". Probe the credential so the failure names the cause.
          # `gem` is private, so HTTP 200 here also proves access to the private set.
          url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/gem"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" || echo 000)

          case "$status" in
            200)
              echo "present=true" >> "$GITHUB_OUTPUT"
              ;;
            401)
              echo "::error title=BELIECHAIN_CI_TOKEN has expired::The secret exists but GitHub rejected it (HTTP 401). Fine-grained PATs expire on a fixed date. Mint a replacement with Contents: read-only on infra, kinich-quantum, nawal-ai, pakit-storage, gem and belizechain.org, then run: gh secret set BELIECHAIN_CI_TOKEN -R ${GITHUB_REPOSITORY}"
              exit 1
              ;;
            404)
              echo "::error title=BELIECHAIN_CI_TOKEN is valid but cannot read the private siblings::HTTP 404 for ${url}. Two causes, both worth checking: (a) under Repository access the six private repos must be explicitly selected — infra, kinich-quantum, nawal-ai, pakit-storage, gem, belizechain.org; (b) if the org requires approval for fine-grained PATs, the token sits pending until an org owner approves it. Check pending requests at https://github.com/organizations/BelizeChain/settings/personal-access-tokens."
              exit 1
              ;;
            *)
              echo "::error title=Could not verify BELIECHAIN_CI_TOKEN::Unexpected HTTP ${status} from ${url}."
              exit 1
              ;;
          esac

      # Measured 2026-11-09: exactly two of the eight repos are public
      # (`belizechain`, `ui`) and six are private (`infra`, `kinich-quantum`,
      # `nawal-ai`, `pakit-storage`, `gem`, `belizechain.org`).
      #
      # So a fine-grained PAT with Contents: read needs the SIX private repos and
      # nothing else. This repo is checked out with the workflow's own token, and
      # `ui` is public, so neither belongs in the PAT — a PAT scoped only to the
      # private six returns 404 for `ui`, which is why the `ui` checkout below must
      # NOT pass the token. Passing it anyway was a latent break: it worked only
      # because the PAT used to be scoped to everything.
      #
      # Until the secret exists, the same coverage is available locally from the
      # multi-root workspace root (measured 2026-11-07: PASSED, 0 failures):
      #   ./belizechain/scripts/doc-claims/check-doc-claims.sh belizechain

      # All repos land as siblings under $GITHUB_WORKSPACE, which is exactly the
      # layout the checker's workspace-mode detection expects.
      - name: Check out this repo
        uses: actions/checkout@v7
        with:
          path: belizechain

      - name: Check out sibling repos
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          # No `token:` — `ui` is public, and the PAT is scoped to the private six
          # only, so passing it here would 404 once the token is correctly scoped.
          repository: ${{ github.repository_owner }}/ui
          path: ui

      - name: Check out infrastructure
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/infra
          token: ${{ secrets.BELIECHAIN_CI_TOKEN }}
          path: infra

      - name: Check out kinich-quantum
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kinich-quantum
          token: ${{ secrets.BELIECHAIN_CI_TOKEN }}
          path: kinich-quantum

      - name: Check out nawal-ai
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/nawal-ai
          token: ${{ secrets.BELIECHAIN_CI_TOKEN }}
          path: nawal-ai

      - name: Check out pakit-storage
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/pakit-storage
          token: ${{ secrets.BELIECHAIN_CI_TOKEN }}
          path: pakit-storage

      - name: Check out gem
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/gem
          token: ${{ secrets.BELIECHAIN_CI_TOKEN }}
          path: gem

      - name: Check out belizechain.org
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/belizechain.org
          token: ${{ secrets.BELIECHAIN_CI_TOKEN }}
          path: belizechain.org

      - name: Run doc-claims checker across the workspace
        run: ./belizechain/scripts/doc-claims/check-doc-claims.sh belizechain

      # Without the token the previous step ran in local-only mode, where six
      # cross-repo checks report SKIP. On the nightly run that is a failure, not
      # a warning: an unmonitored gap is how the last one survived.
      - name: Fail the nightly run when cross-repo checks could not run
        if: steps.token.outputs.present != 'true' && github.event_name == 'schedule'
        run: |
          echo "::error title=Cross-repo doc-claims never ran::Add a BELIECHAIN_CI_TOKEN secret — a fine-grained PAT with Contents: read on the six private sibling repos (infra, kinich-quantum, nawal-ai, pakit-storage, gem, belizechain.org). Until then run ./belizechain/scripts/doc-claims/check-doc-claims.sh belizechain locally from the workspace root."
          exit 1
