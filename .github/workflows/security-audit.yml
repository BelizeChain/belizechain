# ─────────────────────────────────────────────────────────
# BelizeChain — Automated Security Audit
# Runs cargo audit on every push/PR that touches dependencies,
# plus a weekly scheduled scan every Monday at 6am UTC.
# ─────────────────────────────────────────────────────────

name: Security Audit

on:
  push:
    branches: [belizechain]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [belizechain]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Every Monday at 6am UTC — catches new RustSec advisories
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege — scans only read the repo.
permissions:
  contents: read

jobs:
  # ── 1. cargo audit — advisory database scan ─────────────
  audit:
    name: 🔒 Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # The @1.90.0 ref itself pins the toolchain. This action has NO
        # `toolchain` input — passing one is silently ignored.
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          set -o pipefail
          # Ignore SDK-blocked advisories that cannot be resolved until
          # polkadot-sdk upgrades its transitive dependencies. cargo-audit scans
          # the full lockfile, so it keeps a few lockfile-only exceptions that
          # cargo-deny's target graph no longer sees.
          #
          # RUSTSEC-2026-0344 (ruzstd 0.8.2 decompression bomb, high) is the
          # clearest case of the lockfile-only class. It is reached ONLY as
          #   ruzstd <- smoldot <- smoldot-light <- subxt-lightclient
          #          <- subxt <- frame-benchmarking-cli <- belizechain-node
          # and `frame-benchmarking-cli` is an OPTIONAL node dependency pulled
          # in by the non-default `runtime-benchmarks` feature, which the
          # production Dockerfile does not set (CARGO_FEATURES=testnet-fast-
          # epoch). The crate is therefore absent from shipped node images, and
          # cargo-deny's feature graph never sees it - which is why the Cargo
          # Deny job stays green. No upgrade path exists: smoldot-light 1.3.2
          # pins smoldot ^2.0.0, and every smoldot release (2.2.0, 3.0.0, 4.0.0
          # and 5.0.0) still requires ruzstd ^0.8.0, so 0.9.1 is unreachable
          # until subxt/smoldot move. Verified 2026-10-13 via the crates.io
          # dependency API. Intentionally NOT added to deny.toml's ignore list,
          # which is reserved for advisories cargo-deny actually detects.
          #
          # ── Added 2026-10-23: two libp2p-pinned advisories ────────────────
          # Published 2026-10-19/20; neither can be cleared from this repo.
          #
          # RUSTSEC-2026-0381 — webpki-roots 0.25.4, required by
          # libp2p-websocket 0.44.0 <- libp2p 0.54.1 <- sc-network 0.60.0.
          # REACHABLE from the node build graph. Only fix is >= 1.0.10; the
          # requirement is ^0.25, a major the 0.25 line cannot reach.
          # cargo-deny reports this one too, so it is also in deny.toml.
          #
          # RUSTSEC-2026-0382 — rustls-webpki 0.101.7, distrusted emSign roots.
          # Reachable ONLY through libp2p's OPTIONAL `quic` feature (libp2p
          # 0.54.1: `quic = ["dep:libp2p-quic"]` -> libp2p-quic -> libp2p-tls
          # 0.5.0 -> rustls-webpki 0.101.7). We take libp2p's `default`
          # features via sc-network, which does not include `quic`, so Cargo
          # records the crate in Cargo.lock but never compiles it. Measured:
          # `cargo tree -i rustls-webpki@0.101.7 --target all` prints nothing,
          # and the only resolved copy is 0.103.16 (patched). Cargo does not
          # prune a disabled optional dep, so `cargo update --workspace` cannot
          # clear this — an ignore is the only lever. cargo-deny's feature graph
          # never sees it, so it is deliberately absent from deny.toml.
          # That "never compiled" claim is load-bearing, so a later step checks
          # it instead of trusting it.
          cargo audit \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2025-0010 \
            --ignore RUSTSEC-2025-0118 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0006 \
            --ignore RUSTSEC-2026-0020 \
            --ignore RUSTSEC-2026-0021 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0085 \
            --ignore RUSTSEC-2026-0086 \
            --ignore RUSTSEC-2026-0087 \
            --ignore RUSTSEC-2026-0088 \
            --ignore RUSTSEC-2026-0089 \
            --ignore RUSTSEC-2026-0091 \
            --ignore RUSTSEC-2026-0092 \
            --ignore RUSTSEC-2026-0093 \
            --ignore RUSTSEC-2026-0094 \
            --ignore RUSTSEC-2026-0095 \
            --ignore RUSTSEC-2026-0096 \
            --ignore RUSTSEC-2026-0114 \
            --ignore RUSTSEC-2026-0105 \
            --ignore RUSTSEC-2025-0161 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2022-0061 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0186 \
            --ignore RUSTSEC-2026-0253 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0222 \
            --ignore RUSTSEC-2026-0269 \
            --ignore RUSTSEC-2026-0285 \
            --ignore RUSTSEC-2026-0344 \
            --ignore RUSTSEC-2026-0381 \
            --ignore RUSTSEC-2026-0382 \
            2>&1 | tee cargo_audit_output.txt
        continue-on-error: false

      - name: Assert rustls-webpki 0.101.x is absent from the node build graph
        # RUSTSEC-2026-0382 is ignored above on the grounds that its affected
        # copy is a lockfile-only entry that the node never compiles. That is
        # the whole justification for accepting it, so it is verified here: if
        # the 0.101 line ever becomes reachable, this step fails and the ignore
        # has to be re-triaged instead of silently covering a live path.
        run: |
          set -o pipefail
          graph="$(cargo tree --locked -p belizechain-node -e normal --prefix none)"
          found="$(printf '%s\n' "$graph" | grep -oE 'rustls-webpki v0\.101\.[0-9]+' | sort -u || true)"
          if [[ -n "$found" ]]; then
            echo "::error::RUSTSEC-2026-0382 is ignored, but rustls-webpki 0.101.x is now in the node build graph: $found"
            exit 1
          fi
          echo "OK: node build graph has no rustls-webpki 0.101.x"
          printf '%s\n' "$graph" | grep -oE 'rustls-webpki v[0-9.]+' | sort -u

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-results
          path: cargo_audit_output.txt
          retention-days: 90

  # ── 2. cargo deny — license + ban + source checks ──────
  deny:
    name: 🛡️ Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        run: |
          DENY_VERSION=0.19.0
          curl -L "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xzf - -C /usr/local/bin --strip-components=1
          cargo-deny --version

      - name: Run cargo deny check
        run: cargo deny check 2>&1

  # ── 3. Yanked crate detection ──────────────────────────
  yanked:
    name: 📦 Yanked Crate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check for yanked crates
        run: |
          # Same SDK-blocked ignores as the audit job (see deny.toml for triage,
          # and that job for the RUSTSEC-2026-0344 lockfile-only rationale).
          # Keep the two lists identical so one advisory cannot pass one job and
          # fail the other.
          #
          # ── Added 2026-10-23: two libp2p-pinned advisories ────────────────
          # Published 2026-10-19/20; neither can be cleared from this repo.
          #
          # RUSTSEC-2026-0381 — webpki-roots 0.25.4, required by
          # libp2p-websocket 0.44.0 <- libp2p 0.54.1 <- sc-network 0.60.0.
          # REACHABLE from the node build graph. Only fix is >= 1.0.10; the
          # requirement is ^0.25, a major the 0.25 line cannot reach.
          # cargo-deny reports this one too, so it is also in deny.toml.
          #
          # RUSTSEC-2026-0382 — rustls-webpki 0.101.7, distrusted emSign roots.
          # Reachable ONLY through libp2p's OPTIONAL `quic` feature (libp2p
          # 0.54.1: `quic = ["dep:libp2p-quic"]` -> libp2p-quic -> libp2p-tls
          # 0.5.0 -> rustls-webpki 0.101.7). We take libp2p's `default`
          # features via sc-network, which does not include `quic`, so Cargo
          # records the crate in Cargo.lock but never compiles it. Measured:
          # `cargo tree -i rustls-webpki@0.101.7 --target all` prints nothing,
          # and the only resolved copy is 0.103.16 (patched). Cargo does not
          # prune a disabled optional dep, so `cargo update --workspace` cannot
          # clear this — an ignore is the only lever. cargo-deny's feature graph
          # never sees it, so it is deliberately absent from deny.toml.
          # That "never compiled" claim is load-bearing, so a later step checks
          # it instead of trusting it.
          cargo audit --deny yanked \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2025-0010 \
            --ignore RUSTSEC-2025-0118 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0006 \
            --ignore RUSTSEC-2026-0020 \
            --ignore RUSTSEC-2026-0021 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0085 \
            --ignore RUSTSEC-2026-0086 \
            --ignore RUSTSEC-2026-0087 \
            --ignore RUSTSEC-2026-0088 \
            --ignore RUSTSEC-2026-0089 \
            --ignore RUSTSEC-2026-0091 \
            --ignore RUSTSEC-2026-0092 \
            --ignore RUSTSEC-2026-0093 \
            --ignore RUSTSEC-2026-0094 \
            --ignore RUSTSEC-2026-0095 \
            --ignore RUSTSEC-2026-0096 \
            --ignore RUSTSEC-2026-0114 \
            --ignore RUSTSEC-2026-0105 \
            --ignore RUSTSEC-2025-0161 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2022-0061 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0186 \
            --ignore RUSTSEC-2026-0253 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0222 \
            --ignore RUSTSEC-2026-0269 \
            --ignore RUSTSEC-2026-0285 \
            --ignore RUSTSEC-2026-0344 \
            --ignore RUSTSEC-2026-0381 \
            --ignore RUSTSEC-2026-0382 \
            2>&1

  # ── 4. Dependabot alerts — the advisories RustSec does not carry ──────────
  #
  # `cargo audit` and `cargo deny` both read the RustSec advisory database.
  # Some GitHub-reviewed advisories never reach it, so a crate can be reported by
  # Dependabot while both scanners report clean. That gap is real and was found
  # on 2026-10-23: GHSA-5j98-2g5x-46v6 (hickory-resolver — DNSSEC validation
  # failures obscured) is reported by Dependabot and by neither scanner, because
  # RustSec has no hickory-resolver entry at all.
  #
  # This job is the compensating control: it reads the alerts GitHub has already
  # computed for this repo, so the same database gap cannot blind it. Accepted
  # risks live in scripts/dependabot_acknowledged.tsv, mirroring deny.toml.
  dependabot:
    name: 🤖 Dependabot Alerts
    runs-on: ubuntu-latest
    # Reading alerts needs this scope; without it the API returns 403 and the
    # job would pass for the wrong reason.
    permissions:
      contents: read
      security-events: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Fail on unacknowledged high/critical Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # `state=open` only — dismissed and fixed alerts are decisions already
          # made and should not re-fail the build.
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/dependabot/alerts?state=open&per_page=100" \
            > "$RUNNER_TEMP/alerts.json"

          jq '[.[] | select(.security_advisory.severity == "high"
            or .security_advisory.severity == "critical")]' \
            "$RUNNER_TEMP/alerts.json" > "$RUNNER_TEMP/open_high.json"

          ack_file="scripts/dependabot_acknowledged.tsv"
          acknowledged="$(awk -F'\t' '!/^#/ && NF >= 3 { print $1 }' "$ack_file" | sort -u)"
          open_ids="$(jq -r '.[].security_advisory.ghsa_id' "$RUNNER_TEMP/open_high.json" | sort -u)"

          # ── 1. Anything open and NOT acknowledged fails the build ──────────
          unacked="$(comm -23 <(printf '%s\n' "$open_ids") <(printf '%s\n' "$acknowledged") \
            | grep -v '^$' || true)"

          if [ -n "$unacked" ]; then
            jq -r --arg ids "$unacked" '
              ($ids | split("\n")) as $list
              | .[]
              | select(.security_advisory.ghsa_id as $g | $list | index($g))
              | .security_advisory.severity as $sev
              | .security_advisory.ghsa_id as $ghsa
              | .security_advisory.summary as $summary
              | .dependency.package.name as $pkg
              | .dependency.manifest_path as $manifest
              | (.security_vulnerability.vulnerable_version_range // "?") as $range
              | (.security_vulnerability.first_patched_version.identifier // "none") as $patched
              | "::error::UNACKNOWLEDGED \($sev) \($ghsa) \($pkg) (\($manifest)): \($summary) | vulnerable: \($range) | patched: \($patched)"
            ' "$RUNNER_TEMP/open_high.json"
            echo "::error::Triage each alert above. If the fix needs a semver-incompatible"
            echo "::error::bump, record it in ${ack_file} with a justification."
            exit 1
          fi

          # ── 2. An acknowledgement that no longer matches anything is stale ─
          stale="$(comm -13 <(printf '%s\n' "$open_ids") <(printf '%s\n' "$acknowledged") \
            | grep -v '^$' || true)"

          if [ -n "$stale" ]; then
            echo "::error::Stale acknowledgement(s) in ${ack_file} — these alerts are no"
            echo "::error::longer open, so the entry is dead weight and hides the next issue:"
            printf '%s\n' "$stale" | sed 's/^/::error::  /'
            exit 1
          fi

          ack_count="$(printf '%s\n' "$acknowledged" | grep -cv '^$' || true)"
          echo "OK: ${ack_count} acknowledged, no unacknowledged high/critical alerts"
          jq -r '.[] | "  \(.security_advisory.severity) \(.security_advisory.ghsa_id) \(.dependency.package.name)"' \
            "$RUNNER_TEMP/open_high.json"
