# ─────────────────────────────────────────────────────────
# BelizeChain — Automated Security Audit
# Runs cargo audit on every push/PR that touches dependencies,
# plus a weekly scheduled scan every Monday at 6am UTC.
# ─────────────────────────────────────────────────────────

name: Security Audit

on:
  push:
    branches: [belizechain]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [belizechain]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Every Monday at 6am UTC — catches new RustSec advisories
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege — scans only read the repo.
permissions:
  contents: read

jobs:
  # ── 1. cargo audit — advisory database scan ─────────────
  audit:
    name: 🔒 Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # The @1.90.0 ref itself pins the toolchain. This action has NO
        # `toolchain` input — passing one is silently ignored.
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          set -o pipefail
          # Ignore SDK-blocked advisories that cannot be resolved until
          # polkadot-sdk upgrades its transitive dependencies. cargo-audit scans
          # the full lockfile, so it keeps a few lockfile-only exceptions that
          # cargo-deny's target graph no longer sees.
          #
          # RUSTSEC-2026-0344 (ruzstd 0.8.2 decompression bomb, high) is the
          # clearest case of the lockfile-only class. It is reached ONLY as
          #   ruzstd <- smoldot <- smoldot-light <- subxt-lightclient
          #          <- subxt <- frame-benchmarking-cli <- belizechain-node
          # and `frame-benchmarking-cli` is an OPTIONAL node dependency pulled
          # in by the non-default `runtime-benchmarks` feature, which the
          # production Dockerfile does not set (CARGO_FEATURES=testnet-fast-
          # epoch). The crate is therefore absent from shipped node images, and
          # cargo-deny's feature graph never sees it - which is why the Cargo
          # Deny job stays green. No upgrade path exists: smoldot-light 1.3.2
          # pins smoldot ^2.0.0, and every smoldot release (2.2.0, 3.0.0, 4.0.0
          # and 5.0.0) still requires ruzstd ^0.8.0, so 0.9.1 is unreachable
          # until subxt/smoldot move. Verified 2026-10-13 via the crates.io
          # dependency API. Intentionally NOT added to deny.toml's ignore list,
          # which is reserved for advisories cargo-deny actually detects.
          cargo audit \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2025-0010 \
            --ignore RUSTSEC-2025-0118 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0006 \
            --ignore RUSTSEC-2026-0020 \
            --ignore RUSTSEC-2026-0021 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0085 \
            --ignore RUSTSEC-2026-0086 \
            --ignore RUSTSEC-2026-0087 \
            --ignore RUSTSEC-2026-0088 \
            --ignore RUSTSEC-2026-0089 \
            --ignore RUSTSEC-2026-0091 \
            --ignore RUSTSEC-2026-0092 \
            --ignore RUSTSEC-2026-0093 \
            --ignore RUSTSEC-2026-0094 \
            --ignore RUSTSEC-2026-0095 \
            --ignore RUSTSEC-2026-0096 \
            --ignore RUSTSEC-2026-0114 \
            --ignore RUSTSEC-2026-0105 \
            --ignore RUSTSEC-2025-0161 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2022-0061 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0186 \
            --ignore RUSTSEC-2026-0253 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0222 \
            --ignore RUSTSEC-2026-0269 \
            --ignore RUSTSEC-2026-0285 \
            --ignore RUSTSEC-2026-0344 \
            2>&1 | tee cargo_audit_output.txt
        continue-on-error: false

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-results
          path: cargo_audit_output.txt
          retention-days: 90

  # ── 2. cargo deny — license + ban + source checks ──────
  deny:
    name: 🛡️ Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        run: |
          DENY_VERSION=0.19.0
          curl -L "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xzf - -C /usr/local/bin --strip-components=1
          cargo-deny --version

      - name: Run cargo deny check
        run: cargo deny check 2>&1

  # ── 3. Yanked crate detection ──────────────────────────
  yanked:
    name: 📦 Yanked Crate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check for yanked crates
        run: |
          # Same SDK-blocked ignores as the audit job (see deny.toml for triage,
          # and that job for the RUSTSEC-2026-0344 lockfile-only rationale).
          # Keep the two lists identical so one advisory cannot pass one job and
          # fail the other.
          cargo audit --deny yanked \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2025-0010 \
            --ignore RUSTSEC-2025-0118 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0006 \
            --ignore RUSTSEC-2026-0020 \
            --ignore RUSTSEC-2026-0021 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0085 \
            --ignore RUSTSEC-2026-0086 \
            --ignore RUSTSEC-2026-0087 \
            --ignore RUSTSEC-2026-0088 \
            --ignore RUSTSEC-2026-0089 \
            --ignore RUSTSEC-2026-0091 \
            --ignore RUSTSEC-2026-0092 \
            --ignore RUSTSEC-2026-0093 \
            --ignore RUSTSEC-2026-0094 \
            --ignore RUSTSEC-2026-0095 \
            --ignore RUSTSEC-2026-0096 \
            --ignore RUSTSEC-2026-0114 \
            --ignore RUSTSEC-2026-0105 \
            --ignore RUSTSEC-2025-0161 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2022-0061 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0186 \
            --ignore RUSTSEC-2026-0253 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0222 \
            --ignore RUSTSEC-2026-0269 \
            --ignore RUSTSEC-2026-0285 \
            --ignore RUSTSEC-2026-0344 \
            2>&1
