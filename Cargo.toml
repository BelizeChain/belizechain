# General dependencies  
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }
serde = { version = "1.0.196", default-features = false }
log = { version = "0.4.21", default-features = false }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-87"] }
clap = { version = "4.5.3" }
futures = { version = "0.3.30" }
tokio = { version = "1.37" }
jsonrpsee = { version = "0.26.0", features = ["server"] }

# Additional RPC dependencies
substrate-frame-rpc-system = { git = "https://github.com/paritytech/polkadot-sdk", rev = "2e4dd0bc22366a5af820492528869a493b5a5208" }

# BelizeChain specific
serde_json = "1.0"
hex = "0.4"
once_cell = "1.19"

# ── Patches ──────────────────────────────────────────────
# frame-benchmarking-cli pulls frame-storage-access-test-runtime,
# whose build.rs panics outside the polkadot-sdk workspace.  Stub it out.
[patch."https://github.com/paritytech/polkadot-sdk"]
frame-storage-access-test-runtime = { path = "patches/frame-storage-access-test-runtime" }

[patch.crates-io]
core2 = { path = "patches/core2" }

# Build profiles for different use cases
[profile.release]
panic = "unwind"  # Allow panic unwinding for better error traces in testing

# Production profile: Maximum optimization for mainnet deployment
# Usage: cargo build --profile production
# Trade-offs: ~15-20 min build time vs. smaller binary + faster runtime
[profile.production]
inherits = "release"
lto = true           # Link-Time Optimization: cross-crate inlining, dead code elimination
codegen-units = 1    # Single codegen unit: enables better optimization at cost of build parallelism

