[workspace]
resolver = "2"
members = [
    "node",
    "runtime",
    "pallets/common",
    "pallets/economy",
    "pallets/payroll",
    "pallets/identity",
    "pallets/governance", 
    "pallets/compliance",
    "pallets/staking",
    "pallets/interoperability",
    "pallets/belizex",
    "pallets/landledger",
    "pallets/consensus",
    "pallets/community",
    "pallets/oracle",
    "pallets/quantum",
    "pallets/bns",
    "pallets/mesh",
    "pallets/justice",
    "pallets/whistleblower",
    "pallets/moderation",
]

[workspace.package]
authors = ["BelizeChain Core Team"]
edition = "2021"
repository = "https://github.com/BelizeChain/belizechain/"
license = "MIT"
homepage = "https://belizechain.org"

[workspace.dependencies]
