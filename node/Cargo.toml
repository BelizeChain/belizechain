[package]
name = "belizechain-node"
version = "0.1.0"
authors = ["BelizeChain Core Team <dev@belizechain.org>"]
description = "BelizeChain sovereign blockchain node implementation"
edition = "2021"
license = "MIT"
homepage = "https://belizechain.org"
repository = "https://github.com/BelizeChain/belizechain/"

[dependencies]
# Substrate core
frame-benchmarking = { workspace = true, features = ["std"] }
frame-benchmarking-cli = { workspace = true, optional = true }
frame-executive = { workspace = true, features = ["std"] }
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
frame-system-benchmarking = { workspace = true, optional = true }
frame-system-rpc-runtime-api = { workspace = true, features = ["std"] }
frame-try-runtime = { workspace = true, optional = true }

# Substrate primitives
sp-api = { workspace = true, features = ["std"] }
sp-block-builder = { workspace = true, features = ["std"] }
sp-consensus-aura = { workspace = true, features = ["std"] }
sp-consensus-grandpa = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-genesis-builder = { workspace = true, features = ["std"] }
sp-inherents = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-keyring = { workspace = true, features = ["std"] }
sp-offchain = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-session = { workspace = true, features = ["std"] }
sp-std = { workspace = true, features = ["std"] }
sp-storage = { workspace = true, features = ["std"] }
sp-timestamp = { workspace = true, features = ["std"] }
sp-transaction-pool = { workspace = true, features = ["std"] }
sp-version = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }

# Substrate client
sc-basic-authorship = { workspace = true }
sc-chain-spec = { workspace = true }
sc-cli = { workspace = true }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-aura = { workspace = true }
sc-consensus-grandpa = { workspace = true }
sc-executor = { workspace = true }
sc-keystore = { workspace = true }
sc-network = { workspace = true }
sc-offchain = { workspace = true }
sc-rpc = { workspace = true }
sc-rpc-api = { workspace = true }
sc-service = { workspace = true }
sc-telemetry = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }

# Substrate pallets
pallet-aura = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
pallet-grandpa = { workspace = true, features = ["std"] }
pallet-staking = { workspace = true, features = ["std"] }
pallet-sudo = { workspace = true, features = ["std"] }
pallet-timestamp = { workspace = true, features = ["std"] }
pallet-transaction-payment = { workspace = true, features = ["std"] }
pallet-transaction-payment-rpc = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true, features = ["std"] }

# RPC
substrate-frame-rpc-system = { workspace = true }

# Runtime (includes all pallets)
belizechain-runtime = { path = "../runtime" }

# General dependencies
codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true, features = ["thread-pool"] }
tokio = { workspace = true, features = ["macros", "time", "parking_lot"] }
jsonrpsee = { workspace = true, features = ["server"] }

# Quantum computing integration
# Quantum computing integration (placeholder for future quantum features)
# qiskit-rs = { version = "0.1", optional = true }

[build-dependencies]
substrate-build-script-utils = "11.0.0"

[features]
default = []
std = [
    "frame-benchmarking/std",
    "frame-executive/std",
    "frame-support/std",
    "frame-system/std",
    "frame-system-rpc-runtime-api/std",
    "frame-try-runtime?/std",
    "pallet-aura/std",
    "pallet-balances/std",
    "pallet-grandpa/std",
    "pallet-sudo/std",
    "pallet-timestamp/std",
    "pallet-transaction-payment/std",
    "pallet-transaction-payment-rpc-runtime-api/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-consensus-aura/std",
    "sp-consensus-grandpa/std",
    "sp-core/std",
    "sp-genesis-builder/std",
    "sp-inherents/std",
    "sp-offchain/std",
    "sp-runtime/std",
    "sp-session/std",
    "sp-std/std",
    "sp-storage/std",
    "sp-transaction-pool/std",
    "sp-version/std",
    "belizechain-runtime/std",
]

runtime-benchmarks = [
    "dep:frame-benchmarking-cli",
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system-benchmarking/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-grandpa/runtime-benchmarks",
    "pallet-sudo/runtime-benchmarks",
    "pallet-timestamp/runtime-benchmarks",
    "pallet-staking/runtime-benchmarks",
    "pallet-transaction-payment/runtime-benchmarks",
    "belizechain-runtime/runtime-benchmarks",
]

try-runtime = [
    "frame-try-runtime/try-runtime",
    "frame-executive/try-runtime",
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-aura/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-grandpa/try-runtime",
    "pallet-sudo/try-runtime",
    "pallet-timestamp/try-runtime",
    "pallet-transaction-payment/try-runtime",
    "belizechain-runtime/try-runtime",
]

# Enable quantum features
# Quantum computing features (placeholder)
# quantum = ["qiskit-rs"]