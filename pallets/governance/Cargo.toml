[package]
name = "pallet-belize-governance"
version = "0.1.0"
authors = ["BelizeChain Core Team <dev@belizechain.org>"]
description = "BelizeChain democratic governance with council, community rank, and PoUW voting"
edition = "2021"
license = "MIT"

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

# BelizeChain pallets
pallet-belize-compliance = { path = "../compliance", default-features = false }
pallet-belize-community = { path = "../community", default-features = false }

[dev-dependencies]
pallet-balances = { workspace = true }
sp-io = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "pallet-belize-compliance/std",
    "pallet-belize-community/std",
    "scale-info/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]