[package]
name = "pallet-zk-attestation"
version = "0.1.0"
authors = ["BelizeChain Core Team <dev@belizechain.org>"]
description = "Privacy-preserving registry attestations — Groth16 proof verification and nullifier tracking"
edition = "2021"
license = "MIT"

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
log = { workspace = true, default-features = false }

# The verifier only. The `prover` feature is deliberately NOT enabled — the
# runtime must never link circuit synthesis or the Poseidon parameters.
belizechain-zk-attestation = { path = "../../zk/attestation", default-features = false }

[dev-dependencies]
sp-io = { workspace = true }
sp-core = { workspace = true }
belizechain-zk-attestation = { path = "../../zk/attestation", features = ["prover"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "log/std",
    "frame-support/std",
    "frame-system/std",
    "frame-benchmarking?/std",
    "scale-info/std",
    "sp-runtime/std",
    "sp-std/std",
    "belizechain-zk-attestation/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "frame-benchmarking/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
