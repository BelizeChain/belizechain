[package]
name = "pallet-storage-proof"
version = "0.1.0"
authors = ["BelizeChain Core Team <dev@belizechain.org>"]
description = "On-chain verification of decentralized storage proofs (Merkle-first, ZK-gated)"
edition = "2021"
license = "MIT"

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }
log = { workspace = true, default-features = false }
frame-benchmarking = { workspace = true, optional = true }

# Additional dependencies
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
sp-io = { workspace = true, default-features = false }
pallet-balances = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "log/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-core/std",
    "sp-io/std",
    "serde/std",
    "frame-benchmarking?/std",
    "pallet-balances/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "frame-benchmarking/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-balances/try-runtime",
]
# Stage-B feature gate — NOT accepted in Stage A; dispatchable returns an error
# if requested without a real verifier wired in.
groth16 = []
