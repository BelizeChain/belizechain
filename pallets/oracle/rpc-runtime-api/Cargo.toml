[package]
name = "pallet-belize-oracle-rpc-runtime-api"
version = "0.1.0"
authors = ["BelizeChain Core Team <dev@belizechain.org>"]
description = "Runtime API for the BelizeChain oracle: aggregated price feeds"
edition = "2021"
license = "MIT"

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
sp-api = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }

# BelizeChain pallets
pallet-belize-oracle = { path = "..", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "pallet-belize-oracle/std",
    "sp-api/std",
    "sp-std/std",
]
