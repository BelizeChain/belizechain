[package]
name = "pallet-belize-landledger"
version = "0.1.0"
description = "Belize Land Ledger - Blockchain Property Registry System"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }

# BelizeChain pallets
pallet-belize-common = { path = "../common", default-features = false }
pallet-belize-identity = { path = "../identity", default-features = false }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-io = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }

# Additional dependencies
serde = { workspace = true, features = ["derive"], optional = true }
log = { workspace = true }

[dev-dependencies]
sp-io = { workspace = true }
pallet-balances = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-insecure-randomness-collective-flip = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "pallet-belize-common/std",
    "pallet-belize-identity/std",
    "frame-support/std",
    "frame-system/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-io/std",
    "frame-benchmarking?/std",
    "serde",
    "log/std",
    "pallet-balances/std",
    "pallet-timestamp/std",
    "pallet-insecure-randomness-collective-flip/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "frame-benchmarking/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]