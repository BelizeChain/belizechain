# cargo-deny configuration for BelizeChain
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Targets to check (BelizeChain validators run on x86-64 Linux)
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

# ── Advisories ──────────────────────────────────────────────────────────
# cargo-deny 0.16+ removed per-kind severity controls (vulnerability, unmaintained, etc.).
# All advisories are denied by default; triaged exceptions go in `ignore`.
[advisories]

# Advisories we've triaged as not-applicable or SDK-blocked for BelizeChain.
# Each must have a justification comment.
ignore = [
    # hickory-proto DNS message compression CPU exhaustion — SDK-blocked via
    # libp2p/litep2p in polkadot-sdk; no direct BelizeChain DNS encoder usage.
    "RUSTSEC-2026-0119",

    # hickory-proto DNSSEC NSEC3 validation loop — SDK-blocked via libp2p and
    # litep2p resolver paths; no fixed upgrade is available at this SDK level.
    "RUSTSEC-2026-0118",

    # tracing-subscriber ANSI log injection — pinned exactly by sp-tracing and
    # sc-tracing in polkadot-sdk; logs are not a consensus or auth boundary.
    "RUSTSEC-2025-0055",

    # wasmtime component/Winch/pooling advisories — SDK-blocked through
    # sc-executor-wasmtime 0.44.0; BelizeChain executes governance-controlled
    # runtime Wasm, not arbitrary host-trusted Wasm modules.
    "RUSTSEC-2025-0118",
    "RUSTSEC-2026-0006",
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",

    # libsecp256k1 unmaintained — SDK-blocked through sp-core; tracked for the
    # next polkadot-sdk upgrade rather than patched directly in runtime code.
    "RUSTSEC-2025-0161",

    # fxhash unmaintained — SDK-blocked transitive dep
    "RUSTSEC-2025-0057",

    # instant unmaintained — SDK-blocked transitive dep
    "RUSTSEC-2024-0384",

    # parity-wasm deprecated — SDK-blocked transitive dep
    "RUSTSEC-2022-0061",

    # paste unmaintained — SDK-blocked transitive dep
    "RUSTSEC-2024-0436",

    # proc-macro-error unmaintained — SDK-blocked transitive dep
    "RUSTSEC-2024-0370",
]

# ── Licenses ────────────────────────────────────────────────────────────
[licenses]
# BelizeChain is GPL-3.0-or-later; allow compatible licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# ring uses a custom license that is ISC-style
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# array-bytes uses deprecated SPDX "Apache-2.0/GPL-3.0" (dual-license)
[[licenses.clarify]]
name = "array-bytes"
expression = "Apache-2.0 OR GPL-3.0-only"
license-files = [{ path = "LICENSE", hash = 0x2ba10e1b }]

# proc-macro-warning uses deprecated SPDX "GPL-3.0 OR Apache-2.0"
[[licenses.clarify]]
name = "proc-macro-warning"
expression = "GPL-3.0-only OR Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x15b984e1 }]

# ── Bans ────────────────────────────────────────────────────────────────
[bans]
# Deny multiple versions of the same crate (warn for now — Substrate has many)
multiple-versions = "warn"
# Allow wildcards: workspace members use `workspace = true` which cargo-deny
# reports as wildcard deps. This is standard for Substrate workspaces.
wildcards = "allow"
highlight = "all"

# ── Sources ─────────────────────────────────────────────────────────────
[sources]
# Only allow crates.io and known trusted git sources
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
# Only these GitHub organizations are trusted for git dependencies
github = ["paritytech", "AcalaNetwork", "nicira", "AztecProtocol", "BelizeChain"]
