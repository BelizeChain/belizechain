# cargo-deny configuration for BelizeChain
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Targets to check (BelizeChain validators run on x86-64 Linux)
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

# ── Advisories ──────────────────────────────────────────────────────────
# cargo-deny 0.16+ removed per-kind severity controls (vulnerability, unmaintained, etc.).
# All advisories are denied by default; triaged exceptions go in `ignore`.
[advisories]

# Advisories we've triaged as not-applicable or SDK-blocked for BelizeChain.
# Each must have a justification comment.
ignore = [
    # ── Verified live 2026-10-12 ─────────────────────────────────────────────
    # These 9 are the ONLY advisories reported for the current lockfile. Verified
    # with both cargo-deny 0.19.0 (the version CI pins) and 0.20.2, each run
    # against a copy of this file with `ignore = []`; both reported exactly these
    # 9 and nothing else. The 31 entries previously listed here no longer matched
    # any crate: a suppression that cannot fire protects nothing, and it would
    # silently mask a re-introduction. Re-verify with:
    #   cargo deny check advisories --config <copy of this file, ignore = []>

    # hickory-proto is reached by TWO node-level paths and only one is movable:
    #   libp2p-dns 0.42.0 <- libp2p 0.54.1 <- sc-network   (hickory 0.24.4)
    #   litep2p 0.14.3     <- sc-network                    (hickory 0.25.2)
    # Clearing either needs hickory >= 0.26.1. The libp2p path would need
    # libp2p-dns >= 0.45.0, i.e. libp2p >= 0.57.0 — but polkadot-sdk pins
    # libp2p 0.54.1 in stable2606, stable2609 AND master, so no released (or
    # unreleased) rev clears it. stable2609 does move litep2p to 0.15.3
    # (hickory 0.26.x), but that removes only one of the two copies, so both
    # advisories stay reported either way — and the rev is not worth paying for
    # that: it is a workspace-wide pin set (74 pins) that the runtime consumes
    # too, so it changes the runtime Wasm and needs a spec_version bump and a
    # live upgrade, for zero hickory benefit. Hickory is node-only (absent from
    # the runtime graph) and the resolver is engaged only for /dns/ multiaddrs;
    # testnet-spec.json sets bootNodes: [].
    # DNS message-compression CPU exhaustion (O(n^2) name compression).
    "RUSTSEC-2026-0119",
    # DNSSEC NSEC3 closest-encloser validation loop. No patched release exists;
    # the only unaffected versions are < 0.25.0-alpha.3 or >= 0.26.0-beta.1,
    # neither of which the SDK's resolver lines use.
    "RUSTSEC-2026-0118",

    # tracing-subscriber 0.3.19 ANSI escape injection into logs. polkadot-sdk
    # exact-pins it ("=0.3.19", checked at stable2606 and stable2609), so only an
    # SDK-side change can move it; logs are not a consensus or auth boundary.
    "RUSTSEC-2025-0055",

    # Unmaintained transitive crates the SDK still depends on. None is a direct
    # BelizeChain dependency; each clears only on an SDK-level upgrade.
    # libsecp256k1, via sp-core
    "RUSTSEC-2025-0161",
    # fxhash, via wasmtime -> fxprof-processed-profile
    "RUSTSEC-2025-0057",
    # instant
    "RUSTSEC-2024-0384",
    # parity-wasm, deprecated by its author
    "RUSTSEC-2022-0061",
    # paste
    "RUSTSEC-2024-0436",
    # proc-macro-error
    "RUSTSEC-2024-0370",
]

# Present in the graph but NOT listed above, because cargo-deny does not report
# them at this graph/configuration. Kept here so the knowledge is not lost if a
# future cargo-deny or feature set starts surfacing them:
#   - lru 0.7.8      (RUSTSEC-2026-0253) unsound pop() panic-safety, reached via
#                    tracing-log <- sc-tracing
#   - memmap2 0.5.10 (RUSTSEC-2026-0186) unsound range offsets in
#                    advise_range/flush_range, reached via parity-db
# Both are `informational = "unsound"` advisories rather than vulnerabilities, and
# BelizeChain code calls neither affected API.

# ── Licenses ────────────────────────────────────────────────────────────
[licenses]
# BelizeChain is GPL-3.0-or-later; allow compatible licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# ring uses a custom license that is ISC-style
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# array-bytes uses deprecated SPDX "Apache-2.0/GPL-3.0" (dual-license)
[[licenses.clarify]]
name = "array-bytes"
expression = "Apache-2.0 OR GPL-3.0-only"
license-files = [{ path = "LICENSE", hash = 0x2ba10e1b }]

# proc-macro-warning uses deprecated SPDX "GPL-3.0 OR Apache-2.0"
[[licenses.clarify]]
name = "proc-macro-warning"
expression = "GPL-3.0-only OR Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x15b984e1 }]

# ── Bans ────────────────────────────────────────────────────────────────
[bans]
# Deny multiple versions of the same crate (warn for now — Substrate has many)
multiple-versions = "warn"
# Allow wildcards: workspace members use `workspace = true` which cargo-deny
# reports as wildcard deps. This is standard for Substrate workspaces.
wildcards = "allow"
highlight = "all"

# ── Sources ─────────────────────────────────────────────────────────────
[sources]
# Only allow crates.io and known trusted git sources
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
# Only these GitHub organizations are trusted for git dependencies
github = ["paritytech", "AcalaNetwork", "nicira", "AztecProtocol", "BelizeChain"]
