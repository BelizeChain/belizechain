[package]
name = "belizechain-runtime"
version = "0.1.0"
authors = ["BelizeChain Core Team <dev@belizechain.org>"]
description = "BelizeChain sovereign blockchain runtime"
edition = "2021"
license = "MIT"
homepage = "https://belizechain.org"
repository = "https://github.com/BelizeChain/belizechain/"

[dependencies]
# Substrate core
frame-benchmarking = { workspace = true, default-features = false, optional = true }
frame-executive = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
frame-system-rpc-runtime-api = { workspace = true, default-features = false }
frame-try-runtime = { workspace = true, default-features = false, optional = true }

# Substrate primitives
sp-api = { workspace = true, default-features = false }
sp-block-builder = { workspace = true, default-features = false }
sp-consensus-babe = { workspace = true, default-features = false }
sp-consensus-grandpa = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-genesis-builder = { workspace = true, default-features = false }
sp-inherents = { workspace = true, default-features = false }
sp-offchain = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-session = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-storage = { workspace = true, default-features = false }
sp-transaction-pool = { workspace = true, default-features = false }
sp-version = { workspace = true, default-features = false }

# Substrate pallets
pallet-authorship = { workspace = true, default-features = false }
pallet-babe = { workspace = true, default-features = false }
pallet-offences = { workspace = true, default-features = false }
pallet-balances = { workspace = true, default-features = false }
pallet-grandpa = { workspace = true, default-features = false }
pallet-session = { workspace = true, default-features = false, features = ["historical"] }
pallet-sudo = { workspace = true, default-features = false }
pallet-collective = { workspace = true, default-features = false }
pallet-timestamp = { workspace = true, default-features = false }
pallet-transaction-payment = { workspace = true, default-features = false }
pallet-transaction-payment-rpc-runtime-api = { workspace = true, default-features = false }

# Smart Contracts (GEM Platform)
pallet-contracts = { workspace = true, default-features = false }

# BelizeChain custom pallets
pallet-belize-economy = { path = "../pallets/economy", default-features = false }
pallet-belize-identity = { path = "../pallets/identity", default-features = false }
pallet-belize-governance = { path = "../pallets/governance", default-features = false }
pallet-belize-compliance = { path = "../pallets/compliance", default-features = false }
pallet-belize-staking = { path = "../pallets/staking", default-features = false }
pallet-belize-interoperability = { path = "../pallets/interoperability", default-features = false }
pallet-belize-belizex = { path = "../pallets/belizex", default-features = false }
pallet-belize-landledger = { path = "../pallets/landledger", default-features = false }
pallet-belize-consensus = { path = "../pallets/consensus", default-features = false }
pallet-belize-community = { path = "../pallets/community", default-features = false }
pallet-belize-oracle = { path = "../pallets/oracle", default-features = false }
pallet-belize-payroll = { path = "../pallets/payroll", default-features = false }
pallet-belize-quantum = { path = "../pallets/quantum", default-features = false }
pallet-belize-bns = { path = "../pallets/bns", default-features = false }
pallet-belize-mesh = { path = "../pallets/mesh", default-features = false }
pallet-belize-justice = { path = "../pallets/justice", default-features = false }
pallet-belize-moderation = { path = "../pallets/moderation", default-features = false }
pallet-belize-whistleblower = { path = "../pallets/whistleblower", default-features = false }

sp-staking = { workspace = true, default-features = false }


# General dependencies
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
serde = { workspace = true, default-features = false, optional = true, features = ["derive", "alloc"] }
smallvec = "1.11.0"
log = { workspace = true, default-features = false }
hex-literal = "1.1"

[build-dependencies]
substrate-wasm-builder = "33.0.0"

[dev-dependencies]
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]

std = [
    "frame-benchmarking?/std",
    "frame-executive/std",
    "frame-support/std",
    "frame-system/std",
    "frame-system-rpc-runtime-api/std",
    "frame-try-runtime?/std",
    "pallet-authorship/std",
