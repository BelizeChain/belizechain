# BelizeChain — cargo-tarpaulin configuration
#
# Run locally:  cargo tarpaulin
# Enforces minimum line coverage on all testable BelizeChain code
# (node binary + all custom pallets).
#
# Exclusions:
#   main.rs      - run()/main() are untestable entry points; mod tests still runs
#   service.rs   - Substrate async service bootstrap (requires live node)
#   rpc.rs       - RPC plumbing (requires a real blockchain client)
#   chain_spec.rs - mainnet_genesis() has ~40 lines of intentionally dead
#                  placeholder key material blocked by a const guard;
#                  all chain_spec tests still compile and run.

[default]
packages = [
    "belizechain-node",
    "pallet-belize-belizex",
    "pallet-belize-bns",
    "pallet-belize-common",
    "pallet-belize-community",
    "pallet-belize-compliance",
    "pallet-belize-consensus",
    "pallet-belize-economy",
    "pallet-belize-governance",
    "pallet-belize-identity",
    "pallet-belize-interoperability",
    "pallet-belize-justice",
    "pallet-belize-landledger",
    "pallet-belize-mesh",
    "pallet-belize-moderation",
    "pallet-belize-oracle",
    "pallet-belize-payroll",
    "pallet-belize-quantum",
    "pallet-belize-staking",
    "pallet-belize-whistleblower",
]
include-files = [
    "node/src/*.rs",
    "pallets/*/src/*.rs",
]
exclude-files = [
    "node/src/main.rs",
    "node/src/service.rs",
    "node/src/rpc.rs",
    "node/src/chain_spec.rs",
]
fail-under    = 40.0
skip-clean    = true
out           = ["Lcov"]
output-dir    = "target/coverage"

# Headroom, NOT the fix. The Coverage Gate used to abort with "Timed out waiting
# for test response" before printing any coverage number, and the first reading of
# that was a too-low default timeout (tarpaulin's is 60s, humantime `timeout` key -
# rename = "timeout", default_test_timeout() = 60s; NOT `timeout-seconds`).
#
# That was wrong. Raising it to 300s moved the wall rather than removing it: the
# 2026-10-13 run logged libtest's own "test chain_spec::tests::test_testnet_spec_
# applies_council_genesis_to_storage has been running for over 60 seconds", then
# tarpaulin killed it at ~305s. ONE test, not a slow suite - `build_storage()` on
# the public testnet config, which is unbounded under ptrace instrumentation. That
# single test now carries `#[cfg_attr(tarpaulin, ignore)]` (node/src/chain_spec.rs),
# which is the actual fix; the "Rust Tests" job still runs it uninstrumented.
#
# This stays as a safety net for genuinely slow-but-bounded tests elsewhere in the
# node package, so a transient slowdown cannot kill the job outright. It surfaces a
# real hang instead of masking one.
timeout       = "300s"
